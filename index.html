<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <!-- Vinculando o arquivo de estilos CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🧮 Calculadora de IMC</h1>
        <p class="subtitle">Descubra seu Índice de Massa Corporal de forma rápida</p>

        <div class="form-group">
            <label for="weight">Peso (kg):</label>
            <input type="number" id="weight" step="0.1" placeholder="Ex: 70.5" />
        </div>

        <div class="form-group">
            <label for="height">Altura (m):</label>
            <input type="number" id="height" step="0.01" placeholder="Ex: 1.75" />
        </div>

        <button id="calculate-btn">Calcular</button>

        <!-- Área onde o resultado será exibido -->
        <div id="result-container" class="hidden">
            <h2>Resultado</h2>
            <div id="imc-value"></div>
            <div id="imc-classification"></div>
        </div>
    </div>

    <!-- Vinculando o arquivo de scripts JavaScript -->
    <script src="script.js"></script>
</body>
</html>
